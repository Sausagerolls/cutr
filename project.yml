name: Cutr
options:
  bundleIdPrefix: com.jakewatts
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: J4UJD4Z33J
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Cutr:
    type: application
    platform: iOS
    sources:
      - path: Cutr
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jakewatts.cutr
        PRODUCT_NAME: Cutr
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Cutr/Cutr.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        ENABLE_PREVIEWS: YES
    info:
      path: Cutr/Info.plist
      properties:
        CFBundleDisplayName: Cutr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIBackgroundModes: [remote-notification]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
  CutrTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CutrTests]
    dependencies:
      - target: Cutr
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jakewatts.cutr.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
  CutrUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [CutrUITests]
    dependencies:
      - target: Cutr
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jakewatts.cutr.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Cutr
schemes:
  Cutr:
    build:
      targets:
        Cutr: all
    test:
      targets: [CutrTests, CutrUITests]
